# Fly.io configuration. https://fly.io/docs/reference/configuration/
#
# Deployed by .github/workflows/deploy.yml on push to main. Caddy listens on
# 8080, Fly's default internal_port; tests/deploy-config.test.ts fails CI if
# fly.toml, the Caddyfile and the Dockerfile ever disagree.
app = "fitionary"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: stop the machine when idle and start it on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
