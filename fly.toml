# Fly.io configuration. https://fly.io/docs/reference/configuration/
#
# Deployed by .github/workflows/deploy.yml on push to main. Don't replace this
# file with one generated by `fly launch` or Fly's dashboard: they default
# internal_port to 8080, but Caddy listens on 80 (tests/deploy-config.test.ts
# checks the two agree).
app = "fitionary"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  # Scale to zero: stop the machine when idle and start it on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
